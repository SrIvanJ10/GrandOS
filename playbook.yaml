- name: My first play
  hosts: GrandOS
  tasks:
   - name: Ping my hosts
     ansible.builtin.ping:

   - name: Create server directory
     become: yes
     ansible.builtin.file:
       path: /server
       state: directory
       mode: '0755'
       owner: grandos
       group: grandos

   - name: Send Server code
     ansible.builtin.copy:
      src: ui_server/
      dest: /server/
      backup: yes

   - name: Update repositories and install/upgrade gcc compiler
     ansible.builtin.apt:
      name: gcc
      update_cache: yes